<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cocoa Town</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0f0c29;color:#fff;height:100vh;overflow:hidden}
button,input{font:inherit}
#loginScreen{position:fixed;inset:0;background:#0f0c29;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#loginBox{background:#161a22;border:2px solid #00d2ff;border-radius:14px;padding:22px;width:100%;max-width:340px}
#loginBox h2{text-align:center;color:#00d2ff;margin-bottom:14px}
#nickInput{width:100%;padding:11px;border-radius:8px;border:1px solid #333;background:#0f0c29;color:#fff;margin-bottom:10px}
#loginBox button{width:100%;padding:12px;border:0;border-radius:8px;background:#00d2ff;color:#000;font-weight:bold;margin:5px 0}
#loginMsg{color:#f87171;font-size:12px;text-align:center;min-height:18px}
#serverList{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.srv{display:flex;align-items:center;gap:8px;padding:10px 12px;border:2px solid #2a303c;border-radius:10px;cursor:pointer;background:#0f0c29;font-size:13px}
.srv.on{border-color:#00d2ff;background:#1a2a3a}
.srv .nm{flex:1}.srv .online,.srv .ping{font-size:11px;color:#8a93a6}
#topbar{position:fixed;top:0;left:0;right:0;height:48px;background:#161a22;padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #00d2ff;z-index:40}
#topbar h1{font-size:16px;color:#00d2ff}
#whoInfo{margin-left:auto;font-size:11px;color:#8a93a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnOut{background:transparent;border:1px solid #2a303c;color:#a8b0c2;padding:5px 10px;border-radius:6px}
#mapWrap{position:fixed;inset:48px 0 0;overflow:hidden;background:#1a1a2e}
#map{position:absolute;top:0;left:0;will-change:transform}
#modeSwitch{position:fixed;top:58px;left:10px;background:rgba(0,0,0,.6);border-radius:10px;padding:6px;display:flex;gap:4px;z-index:50}
#modeSwitch button{background:transparent;border:1px solid #2a303c;color:#a8b0c2;padding:5px 10px;border-radius:6px}
#modeSwitch button.on{background:#00d2ff;color:#000}
#playerBadge{position:fixed;top:58px;right:10px;background:rgba(0,0,0,.6);border-radius:10px;padding:8px 12px;font-size:12px;z-index:50}
#chat{position:fixed;bottom:72px;left:10px;right:10px;max-height:140px;overflow-y:auto;background:rgba(0,0,0,.6);border-radius:10px;padding:8px;font-size:12px;z-index:45}
.msg{margin-bottom:4px;word-break:break-word}.msg b{color:#00d2ff}
#chatInput{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:6px;z-index:50}
#msgInput{flex:1;padding:12px;border-radius:10px;border:1px solid #00d2ff;background:#0f0c29;color:#fff;outline:none}
#btnSend{padding:12px 18px;border-radius:10px;border:0;background:#00d2ff;color:#000;font-weight:bold}
#joystick{position:fixed;bottom:90px;left:20px;width:140px;height:140px;border-radius:50%;background:rgba(0,210,255,.15);border:2px solid rgba(0,210,255,.5);z-index:60;display:none;touch-action:none}
#joystick.on{display:block}
#joyKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:#00d2ff;transform:translate(-50%,-50%);pointer-events:none}
</style>
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <h2>🍫 Cocoa Town</h2>
    <input id="nickInput" maxlength="16" placeholder="Ник">
    <div style="font-size:12px;color:#8a93a6;margin-bottom:6px">Сервер:</div>
    <div id="serverList"></div>
    <div style="font-size:12px;color:#8a93a6;margin:8px 0 6px">Скин:</div>
    <div id="skinList" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px"></div>
    <button id="btnPlay">▶ Играть</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="topbar">
  <h1>🍫 Cocoa Town</h1>
  <span id="whoInfo"></span>
  <button id="btnOut">Выйти</button>
</div>
<div id="modeSwitch">
  <button id="modePc">🖥️ ПК</button>
  <button id="modePhone">📱 Телефон</button>
</div>
<div id="mapWrap"><div id="map"></div></div>
<div id="playerBadge">👥 Онлайн: <b id="onlineCount">0</b></div>
<div id="joystick"><div id="joyKnob"></div></div>
<div id="chat"></div>
<div id="chatInput"><input id="msgInput" maxlength="80" placeholder="Написать..."><button id="btnSend">➤</button></div>

<script>
var firebaseConfig={
 apiKey:"AIzaSyC75-qpPIH25maaFrDoyyF1QNYZ7i4BOZ8",
 authDomain:"cocoaserver-9477a.firebaseapp.com",
 projectId:"cocoaserver-9477a",
 storageBucket:"cocoaserver-9477a.firebasestorage.app",
 messagingSenderId:"764432801147",
 appId:"1:764432801147:web:9e7b4e2e721ee5c5f3f1de"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore(), auth=firebase.auth();

var MAP_W=2400,MAP_H=1800,TILE=40;
var me={id:null,nickname:"",skin:"ghost",x:MAP_W/2,y:MAP_H/2};
var players={},myServer="ru",controlMode="pc";
var unsubPlayers=null,unsubChat=null;
var timers={server:null,badge:null,heartbeat:null,cleanup:null};
var gameStarted=false,rafStarted=false,lastWrite=0,lastWrittenX=me.x,lastWrittenY=me.y;
var joyVec={x:0,y:0},keys={};

var SERVERS=[
 {id:"ru",flag:"🇷🇺",name:"Москва"},
 {id:"eu",flag:"🇪🇺",name:"Европа"},
 {id:"asia",flag:"🌏",name:"Азия"},
 {id:"us",flag:"🇺🇸",name:"США"}
];

var SKINS={
ghost:{name:"Призрак",emoji:"👻",body:"#9a9a9a",accent:"#6cff2a",eye:"#000"},
cocoa:{name:"Шоколад",emoji:"🍫",body:"#7b421f",accent:"#ffb36b",eye:"#fff"},
lime:{name:"Лайм",emoji:"🟢",body:"#65c466",accent:"#d8ff55",eye:"#102010"},
blue:{name:"Неон",emoji:"🔵",body:"#39a9ff",accent:"#00eaff",eye:"#06121f"},
pink:{name:"Розовый",emoji:"🩷",body:"#ff72b6",accent:"#ffd0e5",eye:"#3a1025"},
purple:{name:"Фиолетовый",emoji:"🟣",body:"#9b6cff",accent:"#d8baff",eye:"#160b2b"},
gold:{name:"Золотой",emoji:"🟡",body:"#e7b93f",accent:"#fff09a",eye:"#211600"},
red:{name:"Красный",emoji:"🔴",body:"#e64b4b",accent:"#ff9a9a",eye:"#240707"},
cyan:{name:"Циан",emoji:"🩵",body:"#35d6d0",accent:"#b9ffff",eye:"#062423"},
white:{name:"Белый",emoji:"⚪",body:"#eeeeee",accent:"#ffffff",eye:"#202020"},
black:{name:"Чёрный",emoji:"⚫",body:"#25252b",accent:"#7777ff",eye:"#fff"},
rainbow:{name:"Радуга",emoji:"🌈",body:"#ff5c7a",accent:"#55eaff",eye:"#fff"}
};
var selectedSkin="ghost";
function skinSvg(id){
var s=SKINS[id]||SKINS.ghost;
return '<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><defs><linearGradient id="g'+id+'" x1="0" x2="1"><stop stop-color="'+s.body+'"/><stop offset="1" stop-color="'+s.accent+'"/></linearGradient></defs><path d="M20 100 L20 55 Q20 15 50 15 Q80 15 80 55 L80 100 L74 94 L68 100 L62 94 L56 100 L50 94 L44 100 L38 94 L32 100 L26 94 Z" fill="url(#g'+id+')" stroke="#000" stroke-width="2"/><path d="M60 18 Q72 6 78 18 Q72 22 60 18 Z" fill="'+s.accent+'" stroke="#000" stroke-width="1.5"/><line x1="35" y1="55" x2="47" y2="58" stroke="'+s.eye+'" stroke-width="2"/><line x1="53" y1="58" x2="65" y2="55" stroke="'+s.eye+'" stroke-width="2"/></svg>';
}

function tsToMs(ts){
 if(!ts)return 0;
 if(ts.toDate)return ts.toDate().getTime();
 if(typeof ts.seconds==="number")return ts.seconds*1000;
 if(typeof ts==="number")return ts;
 return 0;
}
function escapeHtml(s){
 return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function isFresh(d){
 var ms=tsToMs(d.lastSeen);
 return ms>0 && Date.now()-ms<120000;
}
function renderServerList(){
 var box=document.getElementById("serverList"),html="";
 SERVERS.forEach(function(s){
  html+='<div class="srv '+(s.id===myServer?"on":"")+'" data-srv="'+s.id+'"><span>'+s.flag+'</span><span class="nm">'+s.name+'</span><span class="online" data-online="'+s.id+'">…</span><span class="ping" data-ping="'+s.id+'">—</span></div>';
 });
 box.innerHTML=html;
 box.onclick=function(e){
  var el=e.target.closest(".srv"); if(!el)return;
  myServer=el.dataset.srv;
  box.querySelectorAll(".srv").forEach(function(x){x.classList.remove("on")});
  el.classList.add("on"); refreshServerInfo();
 };
 refreshServerInfo();
 if(timers.server)clearInterval(timers.server);
 timers.server=setInterval(refreshServerInfo,15000);
}
function getOnlineCount(serverId){
 return db.collection("town_players").where("server","==",serverId).limit(100).get().then(function(s){
  var n=0;s.forEach(function(d){if(isFresh(d.data()))n++});return n;
 }).catch(function(){return 0});
}
function measurePing(){
 var t=Date.now();
 return db.collection("_ping").doc("p").get().then(function(){return Date.now()-t}).catch(function(){return Date.now()-t});
}
function refreshServerInfo(){
 SERVERS.forEach(function(s){
  getOnlineCount(s.id).then(function(n){
   var e=document.querySelector('[data-online="'+s.id+'"]');if(e)e.textContent="👥 "+n;
  });
 });
 measurePing().then(function(ms){
  var e=document.querySelector('[data-ping="'+myServer+'"]');if(e)e.textContent=ms+" ms";
 });
}
function buildMap(){
 var s='<svg width="'+MAP_W+'" height="'+MAP_H+'" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#3a5a2a"/>';
 for(var x=0;x<MAP_W;x+=TILE)for(var y=0;y<MAP_H;y+=TILE)
  if((x/TILE+y/TILE)%2===0)s+='<rect x="'+x+'" y="'+y+'" width="'+TILE+'" height="'+TILE+'" fill="#3f6130"/>';
 s+='<rect y="'+(MAP_H/2-60)+'" width="'+MAP_W+'" height="120" fill="#c2b280"/>';
 s+='<rect x="'+(MAP_W/2-60)+'" width="120" height="'+MAP_H+'" fill="#c2b280"/>';
 s+='<ellipse cx="500" cy="500" rx="200" ry="140" fill="#2a5a8a"/><ellipse cx="500" cy="500" rx="180" ry="120" fill="#3a7ab0"/>';
 s+='<rect x="1600" y="300" width="220" height="180" fill="#8a5a2a"/><polygon points="1600,300 1710,220 1820,300" fill="#a03a2a"/>';
 s+='<rect x="1850" y="1000" width="300" height="200" fill="#8a5a2a"/><polygon points="1850,1000 2000,900 2150,1000" fill="#a03a2a"/>';
 [[200,1200],[300,1300],[150,1400],[2100,600],[2200,700],[2150,500]].forEach(function(t){
  s+='<circle cx="'+t[0]+'" cy="'+t[1]+'" r="30" fill="#2a4a1a"/><circle cx="'+t[0]+'" cy="'+(t[1]-10)+'" r="25" fill="#3a6a2a"/>';
 });
 s+="</svg>";document.getElementById("map").innerHTML=s;
}
var meEl=null;
function createMeElement(){
 if(meEl)meEl.remove();
 meEl=document.createElement("div");
 meEl.style.cssText="position:absolute;width:40px;height:48px;transform:translate(-50%,-50%);z-index:100;pointer-events:none";
 meEl.innerHTML=skinSvg(me.skin||selectedSkin);document.getElementById("map").appendChild(meEl);updateMeSprite();
}
function updateMeSprite(){if(meEl){meEl.style.left=me.x+"px";meEl.style.top=me.y+"px"}}
function renderSkinList(){
var box=document.getElementById("skinList"); if(!box)return;
box.innerHTML="";
Object.keys(SKINS).forEach(function(id){
var s=SKINS[id],b=document.createElement("button");
b.type="button"; b.title=s.name;
b.style.cssText="height:54px;border:2px solid "+(id===selectedSkin?"#00d2ff":"#2a303c")+";border-radius:8px;background:#0f0c29;color:#fff;font-size:20px";
b.innerHTML=s.emoji;
b.onclick=function(){selectedSkin=id;box.querySelectorAll("button").forEach(function(x){x.style.borderColor="#2a303c"});b.style.borderColor="#00d2ff"};
box.appendChild(b);
});
}
function applyMode(){
 document.getElementById("modePc").classList.toggle("on",controlMode==="pc");
 document.getElementById("modePhone").classList.toggle("on",controlMode==="phone");
 document.getElementById("joystick").classList.toggle("on",controlMode==="phone");
 try{localStorage.setItem("town_mode",controlMode)}catch(e){}
}
try{
 var saved=localStorage.getItem("town_mode");
 controlMode=saved||(/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)?"phone":"pc");
}catch(e){}

document.getElementById("modePc").onclick=function(){controlMode="pc";joyVec={x:0,y:0};applyMode()};
document.getElementById("modePhone").onclick=function(){controlMode="phone";applyMode()};
document.addEventListener("keydown",function(e){
 if(document.activeElement&&document.activeElement.tagName==="INPUT")return;
 keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();
});
document.addEventListener("keyup",function(e){keys[e.key]=false});

function initJoystick(){
 var joy=document.getElementById("joystick"),knob=document.getElementById("joyKnob"),active=false,cx=0,cy=0,R=50;
 function pos(e){var p=e.touches?e.touches[0]:e,dx=p.clientX-cx,dy=p.clientY-cy,d=Math.hypot(dx,dy);if(d>R){dx=dx/d*R;dy=dy/d*R}knob.style.left="calc(50% + "+dx+"px";knob.style.top="calc(50% + "+dy+"px";joyVec.x=dx/R;joyVec.y=dy/R}
 function start(e){e.preventDefault();active=true;var r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;pos(e)}
 function move(e){if(active){e.preventDefault();pos(e)}}
 function end(){active=false;knob.style.left="50%";knob.style.top="50%";joyVec.x=joyVec.y=0}
 joy.addEventListener("touchstart",start,{passive:false});joy.addEventListener("touchmove",move,{passive:false});joy.addEventListener("touchend",end);joy.addEventListener("touchcancel",end);
 joy.addEventListener("mousedown",start);document.addEventListener("mousemove",move);document.addEventListener("mouseup",end);
}
function tick(){
 var vx=0,vy=0;
 if(keys.ArrowLeft||keys.a||keys.A)vx-=6;if(keys.ArrowRight||keys.d||keys.D)vx+=6;
 if(keys.ArrowUp||keys.w||keys.W)vy-=6;if(keys.ArrowDown||keys.s||keys.S)vy+=6;
 if(joyVec.x||joyVec.y){vx=Math.round(joyVec.x*6);vy=Math.round(joyVec.y*6)}
 if(vx||vy){
  me.x=Math.max(20,Math.min(MAP_W-20,me.x+vx));me.y=Math.max(20,Math.min(MAP_H-20,me.y+vy));updateMeSprite();
  var now=Date.now();
  if(me.id&&now-lastWrite>400&&(Math.abs(me.x-lastWrittenX)>5||Math.abs(me.y-lastWrittenY)>5)){
   lastWrite=now;lastWrittenX=me.x;lastWrittenY=me.y;
   db.collection("town_players").doc(me.id).update({x:me.x,y:me.y,lastSeen:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});
  }
 }
 var w=document.getElementById("mapWrap"),vw=w.clientWidth,vh=w.clientHeight;
 var cx=Math.max(0,Math.min(MAP_W-vw,me.x-vw/2)),cy=Math.max(0,Math.min(MAP_H-vh,me.y-vh/2));
 document.getElementById("map").style.transform="translate("+(-Math.round(cx))+"px,"+(-Math.round(cy))+"px)";
 if(!rafStarted){rafStarted=true;requestAnimationFrame(tick)}
}
function subscribePlayers(){
 if(unsubPlayers)unsubPlayers();
 unsubPlayers=db.collection("town_players").where("server","==",myServer).limit(100).onSnapshot(function(snap){
  var seen={};
  snap.forEach(function(doc){
   var id=doc.id,d=doc.data();if(id===me.id)return;seen[id]=true;
   if(!isFresh(d)){removePlayer(id);return}
   if(!players[id]){
    var el=document.createElement("div");
    el.style.cssText="position:absolute;width:40px;height:48px;transform:translate(-50%,-50%);pointer-events:none;transition:left .15s linear,top .15s linear";
    el.innerHTML=skinSvg(d.skin||"ghost");
    var label=document.createElement("div");label.style.cssText="position:absolute;left:50%;top:110%;transform:translateX(-50%);font-size:10px;white-space:nowrap;text-shadow:0 0 3px #000";label.textContent=d.nickname||"?";el.appendChild(label);
    document.getElementById("map").appendChild(el);players[id]={el:el};
   }
   players[id].el.style.left=(d.x||0)+"px";players[id].el.style.top=(d.y||0)+"px";
  });
  Object.keys(players).forEach(function(id){if(!seen[id])removePlayer(id)});
  document.getElementById("onlineCount").textContent=Object.keys(players).length+1;
 },function(e){console.warn(e)});
}
function removePlayer(id){if(players[id]&&players[id].el)players[id].el.remove();delete players[id]}
function subscribeChat(){
 if(unsubChat)unsubChat();
 unsubChat=db.collection("town_chat").where("server","==",myServer).limit(50).onSnapshot(function(snap){
  var rows=[];snap.forEach(function(d){var x=d.data();rows.push(x)});
  rows.sort(function(a,b){return tsToMs(a.createdAt)-tsToMs(b.createdAt)});
  rows=rows.slice(-15);
  document.getElementById("chat").innerHTML=rows.map(function(d){return '<div class="msg"><b>'+escapeHtml(d.nickname)+':</b> '+escapeHtml(d.text)+'</div>'}).join("");
 },function(e){document.getElementById("chat").innerHTML='<div class="msg" style="color:#f87171">Чат недоступен</div>';console.warn(e)});
}
function startIntervals(){
 if(timers.heartbeat)clearInterval(timers.heartbeat);
 timers.heartbeat=setInterval(function(){if(me.id)db.collection("town_players").doc(me.id).update({lastSeen:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){})},20000);
 if(timers.badge)clearInterval(timers.badge);
 timers.badge=setInterval(updateServerBadge,15000);
 if(timers.cleanup)clearInterval(timers.cleanup);
 timers.cleanup=setInterval(function(){
  db.collection("town_players").where("server","==",myServer).limit(100).get().then(function(s){
   s.forEach(function(d){var x=d.data();if(d.id!==me.id&&(!tsToMs(x.lastSeen)||Date.now()-tsToMs(x.lastSeen)>180000))d.ref.delete().catch(function(){})});
  });
 },300000);
}
function updateServerBadge(){
 getOnlineCount(myServer).then(function(n){measurePing().then(function(ms){
  var s=SERVERS.find(function(x){return x.id===myServer});
  document.getElementById("whoInfo").textContent="👻 "+me.nickname+" • "+s.flag+" "+s.name+" • 👥 "+n+" • "+ms+" ms";
 })});
}
function startGame(){
 if(gameStarted)return;gameStarted=true;
 buildMap();createMeElement();subscribePlayers();subscribeChat();startIntervals();updateServerBadge();applyMode();tick();
}
document.getElementById("btnPlay").onclick=function(){
 var nick=document.getElementById("nickInput").value.trim(),msg=document.getElementById("loginMsg");
 if(nick.length<2){msg.textContent="Ник минимум 2 символа";return}
 msg.textContent="Вход...";
 auth.signInAnonymously().then(function(cred){
  me.id=cred.user.uid;me.nickname=nick;me.skin=selectedSkin;
  return db.collection("town_players").doc(me.id).set({nickname:nick,icon:"ghost",skin:selectedSkin,server:myServer,x:me.x,y:me.y,lastSeen:firebase.firestore.FieldValue.serverTimestamp()});
 }).then(function(){
  document.getElementById("loginScreen").style.display="none";startGame();
 }).catch(function(e){msg.textContent="Ошибка: "+e.message});
};
var lastMsgAt=0;
function sendMessage(){
 var inp=document.getElementById("msgInput"),txt=inp.value.trim(),now=Date.now();
 if(!txt||!me.id||now-lastMsgAt<1000)return;lastMsgAt=now;inp.value="";
 db.collection("town_chat").add({nickname:me.nickname,uid:me.id,server:myServer,text:txt.slice(0,80),createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(e){console.warn(e)});
}
document.getElementById("btnSend").onclick=sendMessage;
document.getElementById("msgInput").addEventListener("keydown",function(e){if(e.key==="Enter")sendMessage()});
document.getElementById("btnOut").onclick=function(){
 var p=me.id?db.collection("town_players").doc(me.id).delete():Promise.resolve();
 p.finally(function(){if(unsubPlayers)unsubPlayers();if(unsubChat)unsubChat();Object.keys(timers).forEach(function(k){if(timers[k])clearInterval(timers[k])});location.reload()});
};
window.addEventListener("resize",function(){});
renderServerList();renderSkinList();applyMode();initJoystick();
</script>
</body>
</html>
